# Alodek DNS Configuration
# DNS Server untuk CTF Cyber Map

# Domain utama
domain cybermap.local

# DNS Server settings
server 127.0.0.1
port 53

# DNS Records
# Format: TYPE domain ip_address

# Main application
A cybermap.local 127.0.0.1
A www.cybermap.local 127.0.0.1

# API endpoint
A api.cybermap.local 127.0.0.1

# Team subdomains
A team1.cybermap.local 127.0.0.1
A team2.cybermap.local 127.0.0.1
A team3.cybermap.local 127.0.0.1
A team4.cybermap.local 127.0.0.1
A team5.cybermap.local 127.0.0.1

# Monitoring
A monitor.cybermap.local 127.0.0.1
A stats.cybermap.local 127.0.0.1

# CNAME records
CNAME map.cybermap.local cybermap.local
CNAME dashboard.cybermap.local cybermap.local
